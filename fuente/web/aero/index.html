<head>

<body>
<header><h1>Aerodinámica</h1><p>Cada avión en vuelo: el aire que lo rodea, el cono de Mach, la sustentación y la resistencia</p></header>
<nav class="sections"><a href="../">Hawk</a><a href="../sr72/">SR-72</a><a href="../f22/">F-22</a><a href="../f14/">F-14</a><a href="../sr71/">SR-71</a><a href="./" aria-current="page">Aero</a><a href="../anatomia/">Anatomía</a></nav>
<footer>Por <a href="https://jorgefajardom-coder.github.io/singularity/" rel="author">Jorge Andres Fajardo Mora</a></footer>
<div id="view"></div>
<div id="loading">Cargando el modelo…</div>
<aside id="panel">
  <div class="planes">
    <button type="button" class="chip" data-plane="hawk">Hawk</button>
    <button type="button" class="chip" data-plane="sr71">SR-71</button>
    <button type="button" class="chip" data-plane="f22">F-22</button>
    <button type="button" class="chip" data-plane="f14">F-14</button>
    <button type="button" class="chip" data-plane="sr72">SR-72</button>
  </div>
  <label class="mach">Mach <output id="machOut">0</output><input id="mach" type="range" min="0.05" max="3" step="0.01" value="0.8" aria-label="Número de Mach"></label>
  <p id="regime"></p>
  <p id="verdict"></p>
  <canvas id="chart" aria-label="Finura (azul) y resistencia (naranja) según el Mach"></canvas>
  <p class="key"><span class="ld">Finura L/D</span><span class="dr">Resistencia</span></p>
  <dl id="data"></dl>
  <p id="note"></p>
  <p class="by">Por <a href="https://jorgefajardom-coder.github.io/singularity/" rel="author">Jorge Andres Fajardo Mora</a></p>
</aside>
